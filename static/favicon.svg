<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1512"/>
      <stop offset="55%" stop-color="#070d0b"/>
      <stop offset="100%" stop-color="#040807"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Rounded Obsidian Shield Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#emeraldGrad)" stroke-width="2.5"/>
  <!-- Subtle PCB Trace / IC Pins -->
  <g stroke="#10b981" stroke-width="1.6" stroke-linecap="round" opacity="0.45">
    <line x1="20" y1="2" x2="20" y2="7"/>
    <line x1="32" y1="2" x2="32" y2="7"/>
    <line x1="44" y1="2" x2="44" y2="7"/>
    <line x1="20" y1="57" x2="20" y2="62"/>
    <line x1="32" y1="57" x2="32" y2="62"/>
    <line x1="44" y1="57" x2="44" y2="62"/>
    <line x1="2" y1="22" x2="7" y2="22"/>
    <line x1="2" y1="42" x2="7" y2="42"/>
    <line x1="57" y1="22" x2="62" y2="22"/>
    <line x1="57" y1="42" x2="62" y2="42"/>
  </g>
  <!-- Inner Circuit Frame -->
  <rect x="9" y="9" width="46" height="46" rx="9" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.28"/>
  <!-- Crisp Geometric "H" + Circuit Node Monogram -->
  <path d="M18 17 V47 M46 17 V47 M18 32 H46" stroke="url(#emeraldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Active Silicon Node on Crossbar -->
  <circle cx="32" cy="32" r="4.2" fill="#070d0b" stroke="url(#cyanAccent)" stroke-width="2.5"/>
  <circle cx="46" cy="17" r="2.5" fill="#38bdf8"/>
  <circle cx="18" cy="47" r="2.5" fill="#34d399"/>
</svg>
