<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-label="Hanz Ofosuhene-Sintim — Electronics &amp; Embedded Systems Engineer">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.055"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="55%" stop-color="#0A0A0E"/>
      <stop offset="100%" stop-color="#0D111A"/>
    </linearGradient>
    <linearGradient id="cobaltGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="22" fill="url(#bgGrad)" stroke="#1F1F23" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="416" rx="22" fill="url(#dotGrid)"/>

  <!-- Ambient Top-Left Glow -->
  <ellipse cx="260" cy="70" rx="290" ry="120" fill="url(#cobaltGlow)"/>

  <!-- ==================== LEFT COLUMN: IDENTITY & LIVE TELEMETRY ==================== -->
  <!-- Live Telemetry Beacon Pill -->
  <g transform="translate(44, 38)">
    <rect x="0" y="0" width="510" height="32" rx="16" fill="#111318" stroke="#1F2937" stroke-width="1"/>
    <!-- Pulsing Green Beacon Dot -->
    <circle cx="18" cy="16" r="5" fill="#10B981">
      <animate attributeName="r" values="4.5;9;4.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="16" r="4.5" fill="#10B981"/>
    <text x="34" y="20.5" fill="#E2E8F0" font-size="11" font-weight="700" letter-spacing="0.8" class="mono">
      LIVE TELEMETRY · LILLE, FRANCE (CET) · AVAILABLE FOR R&amp;D
    </text>
  </g>

  <!-- Eyebrow -->
  <text x="44" y="102" fill="#60A5FA" font-size="11.5" font-weight="700" letter-spacing="1.6" class="mono">
    ELECTRONICS &amp; EMBEDDED SYSTEMS ARCHITECT · BILINGUAL FR / EN
  </text>

  <!-- Primary Name & Title -->
  <text x="44" y="146" fill="#F8FAFC" font-size="36" font-weight="800" letter-spacing="-0.8" class="sans">
    Hanz Ofosuhene-Sintim
  </text>
  <text x="44" y="176" fill="#94A3B8" font-size="15" font-weight="600" class="sans">
    M1 Microelectronics &amp; Embedded Systems @ JUNIA Lille  ·  BSc Computer Engineering @ KNUST
  </text>

  <!-- Architectural Summary -->
  <text x="44" y="210" fill="#A1A1AA" font-size="13" class="sans">
    Prototyping real-time embedded hardware (STM32, ESP32, Arduino), engineering modular C/C++ OOP
  </text>
  <text x="44" y="230" fill="#A1A1AA" font-size="13" class="sans">
    systems with the GCC/GDB WSL toolchain, and modeling normalized 3NF Entity-Relationship schemas.
  </text>

  <!-- Domain Stack Pills Row -->
  <g transform="translate(44, 254)">
    <g transform="translate(0, 0)">
      <rect width="154" height="28" rx="14" fill="#2A1219" stroke="#FB7185" stroke-opacity="0.45"/>
      <text x="77" y="18" text-anchor="middle" fill="#FB7185" font-size="11" font-weight="700" class="mono">STM32 · ESP32 · MCU</text>
    </g>
    <g transform="translate(164, 0)">
      <rect width="168" height="28" rx="14" fill="#101B33" stroke="#60A5FA" stroke-opacity="0.45"/>
      <text x="84" y="18" text-anchor="middle" fill="#60A5FA" font-size="11" font-weight="700" class="mono">C/C++ · GCC/GDB WSL</text>
    </g>
    <g transform="translate(342, 0)">
      <rect width="136" height="28" rx="14" fill="#0B261E" stroke="#34D399" stroke-opacity="0.45"/>
      <text x="68" y="18" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700" class="mono">ER Schema · 3NF</text>
    </g>
    <g transform="translate(488, 0)">
      <rect width="142" height="28" rx="14" fill="#1E1433" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="71" y="18" text-anchor="middle" fill="#A78BFA" font-size="11" font-weight="700" class="mono">Python · Flask API</text>
    </g>
  </g>

  <!-- Bottom Quick Telemetry Dock Strip inside Banner -->
  <g transform="translate(44, 334)">
    <rect x="0" y="0" width="600" height="48" rx="24" fill="#0F1117" stroke="#1F2937"/>
    <circle cx="26" cy="24" r="13" fill="#1E293B"/>
    <text x="26" y="28.5" text-anchor="middle" font-size="13">⚡</text>
    <text x="48" y="21" fill="#F8FAFC" font-size="11.5" font-weight="700" class="sans">
      5 Engineering Builds (3 Completed · 2 Active R&amp;D)
    </text>
    <text x="48" y="36" fill="#94A3B8" font-size="10.5" class="mono">
      ACES Dept. President (KNUST)  ·  GHAFRA Nord (Lille)  ·  H &amp; D&apos;S HUB
    </text>
    <text x="576" y="28" text-anchor="end" fill="#60A5FA" font-size="12" font-weight="700" class="mono">200 OK →</text>
  </g>

  <!-- Vertical Structural Hairline Divider -->
  <line x1="680" y1="30" x2="680" y2="390" stroke="#1F1F23" stroke-width="1.5"/>

  <!-- ==================== RIGHT COLUMN: KINETIC RADIAL ORBIT MIND-MAP ==================== -->
  <g transform="translate(680, 0)">
    <text x="260" y="42" text-anchor="middle" fill="#64748B" font-size="10.5" font-weight="700" letter-spacing="1.4" class="mono">
