    </text>

    <!-- Orbit Rings -->
    <circle cx="260" cy="215" r="72" fill="none" stroke="#1F2937" stroke-dasharray="3 5"/>
    <circle cx="260" cy="215" r="138" fill="none" stroke="#1F2937" stroke-dasharray="4 6"/>

    <!-- Bezier Signal Wires from Center (260,215) to 6 Orbit Nodes -->
    <path id="wire1" d="M 260 215 Q 190 140 120 105" fill="none" stroke="#FB7185" stroke-width="1.8" stroke-opacity="0.55"/>
    <path id="wire2" d="M 260 215 Q 330 140 400 105" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-opacity="0.55"/>
    <path id="wire3" d="M 260 215 Q 175 215 96 215" fill="none" stroke="#34D399" stroke-width="1.8" stroke-opacity="0.55"/>
    <path id="wire4" d="M 260 215 Q 345 215 424 215" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-opacity="0.55"/>
    <path id="wire5" d="M 260 215 Q 190 290 120 325" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.55"/>
    <path id="wire6" d="M 260 215 Q 330 290 400 325" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-opacity="0.55"/>

    <!-- Animated Signal Packets along Wires -->
    <circle r="3.2" fill="#FB7185">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M 260 215 Q 190 140 120 105"/>
    </circle>
    <circle r="3.2" fill="#60A5FA">
      <animateMotion dur="2.9s" repeatCount="indefinite" path="M 260 215 Q 330 140 400 105"/>
    </circle>
    <circle r="3.2" fill="#34D399">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 260 215 Q 175 215 96 215"/>
    </circle>
    <circle r="3.2" fill="#FBBF24">
      <animateMotion dur="3.1s" repeatCount="indefinite" path="M 260 215 Q 345 215 424 215"/>
    </circle>
    <circle r="3.2" fill="#22D3EE">
      <animateMotion dur="2.7s" repeatCount="indefinite" path="M 260 215 Q 190 290 120 325"/>
    </circle>
    <circle r="3.2" fill="#A78BFA">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M 260 215 Q 330 290 400 325"/>
    </circle>

    <!-- Orbit Capsule 1: EMB (Top Left) -->
    <g transform="translate(32, 82)">
      <rect width="152" height="44" rx="22" fill="#121318" stroke="#FB7185" stroke-width="1.4"/>
      <circle cx="24" cy="22" r="14" fill="#2A1219"/>
      <text x="24" y="25.5" text-anchor="middle" fill="#FB7185" font-size="9.5" font-weight="800" class="mono">MCU</text>
      <text x="46" y="19" fill="#F8FAFC" font-size="11" font-weight="700" class="sans">Embedded R&amp;D</text>
      <text x="46" y="32" fill="#94A3B8" font-size="9.5" class="mono">STM32 · ESP32</text>
    </g>

    <!-- Orbit Capsule 2: C++ (Top Right) -->
    <g transform="translate(336, 82)">
      <rect width="152" height="44" rx="22" fill="#121318" stroke="#60A5FA" stroke-width="1.4"/>
      <circle cx="24" cy="22" r="14" fill="#101B33"/>
      <text x="24" y="25.5" text-anchor="middle" fill="#60A5FA" font-size="9.5" font-weight="800" class="mono">C++</text>
      <text x="46" y="19" fill="#F8FAFC" font-size="11" font-weight="700" class="sans">Systems &amp; OOP</text>
      <text x="46" y="32" fill="#94A3B8" font-size="9.5" class="mono">GCC / GDB (WSL)</text>
    </g>

    <!-- Orbit Capsule 3: DATA (Mid Left) -->
    <g transform="translate(14, 193)">
      <rect width="152" height="44" rx="22" fill="#121318" stroke="#34D399" stroke-width="1.4"/>
      <circle cx="24" cy="22" r="14" fill="#0B261E"/>
      <text x="24" y="25.5" text-anchor="middle" fill="#34D399" font-size="9.5" font-weight="800" class="mono">3NF</text>
      <text x="46" y="19" fill="#F8FAFC" font-size="11" font-weight="700" class="sans">ER Schemas</text>
      <text x="46" y="32" fill="#94A3B8" font-size="9.5" class="mono">Data Modeling</text>
    </g>

    <!-- Orbit Capsule 4: LEAD (Mid Right) -->
    <g transform="translate(354, 193)">
      <rect width="152" height="44" rx="22" fill="#121318" stroke="#FBBF24" stroke-width="1.4"/>
      <circle cx="24" cy="22" r="14" fill="#291D0A"/>
      <text x="24" y="25.5" text-anchor="middle" fill="#FBBF24" font-size="9" font-weight="800" class="mono">LEAD</text>
      <text x="46" y="19" fill="#F8FAFC" font-size="11" font-weight="700" class="sans">Leadership</text>
      <text x="46" y="32" fill="#94A3B8" font-size="9.5" class="mono">ACES · GHAFRA</text>
    </g>

    <!-- Orbit Capsule 5: EDU (Bottom Left) -->
    <g transform="translate(32, 304)">
      <rect width="152" height="44" rx="22" fill="#121318" stroke="#22D3EE" stroke-width="1.4"/>
      <circle cx="24" cy="22" r="14" fill="#0B252E"/>
      <text x="24" y="25.5" text-anchor="middle" fill="#22D3EE" font-size="9.5" font-weight="800" class="mono">EDU</text>
      <text x="46" y="19" fill="#F8FAFC" font-size="11" font-weight="700" class="sans">JUNIA · KNUST</text>
      <text x="46" y="32" fill="#94A3B8" font-size="9.5" class="mono">M1 · BSc Eng</text>
    </g>

    <!-- Orbit Capsule 6: API (Bottom Right) -->
    <g transform="translate(336, 304)">
      <rect width="152" height="44" rx="22" fill="#121318" stroke="#A78BFA" stroke-width="1.4"/>
      <circle cx="24" cy="22" r="14" fill="#1E1433"/>
      <text x="24" y="25.5" text-anchor="middle" fill="#A78BFA" font-size="9.5" font-weight="800" class="mono">API</text>
      <text x="46" y="19" fill="#F8FAFC" font-size="11" font-weight="700" class="sans">Flask Telemetry</text>
      <text x="46" y="32" fill="#94A3B8" font-size="9.5" class="mono">/api/projects</text>
    </g>

    <!-- Center Hub Node -->
    <circle cx="260" cy="215" r="44" fill="#0F172A" stroke="#2563EB" stroke-width="2.5"/>
    <circle cx="260" cy="215" r="37" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="260" y="212" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="800" class="mono">HOS</text>
    <text x="260" y="227" text-anchor="middle" fill="#60A5FA" font-size="8.5" font-weight="700" class="mono">CORE HUB</text>
    <circle cx="290" cy="184" r="6" fill="#10B981" stroke="#0A0A0E" stroke-width="2"/>
  </g>
</svg>
